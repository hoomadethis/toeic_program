const S={'700':{days:'all',count:20,types:new Set(['kor'])},'850':{days:'all',count:20,types:new Set(['kor'])}};
const QS={'700':[],'850':[]};

function switchTab(v){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['700','850'][i]===v));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+v));
}
function toggleAll(v){
  S[v].days='all';
  document.getElementById('all-'+v).classList.add('selected');
  document.querySelectorAll('#tab-'+v+' .day-btn').forEach(b=>b.classList.remove('selected'));
}
function toggleDay(btn){
  const v=btn.dataset.ver, day=btn.dataset.day, st=S[v];
  document.getElementById('all-'+v).classList.remove('selected');
  if(st.days==='all') st.days=new Set();
  if(st.days.has(day)){st.days.delete(day);btn.classList.remove('selected');if(st.days.size===0){st.days='all';document.getElementById('all-'+v).classList.add('selected');}}
  else{st.days.add(day);btn.classList.add('selected');}
}
function selCount(v,n){
  S[v].count=n;
  document.querySelectorAll('#cnt-'+v+' .count-btn').forEach(b=>b.classList.toggle('selected',parseInt(b.dataset.n)===n));
}
function selType(v,t){
  const st=S[v];
  const btn=document.querySelector('#typ-'+v+' .type-btn[data-t="'+t+'"]');
  if(st.types.has(t)){if(st.types.size===1)return;st.types.delete(t);btn.classList.remove('selected');}
  else{st.types.add(t);btn.classList.add('selected');}
}
function gen(v){
  const st=S[v], words=DATA[v];
  let pool=[];
  if(st.days==='all'){Object.values(words).forEach(w=>pool.push(...w));}
  else{st.days.forEach(d=>{if(words[d])pool.push(...words[d]);});}
  const err=document.getElementById('err-'+v);
  if(!pool.length){err.textContent='선택한 범위에 단어가 없습니다.';err.style.display='block';return;}
  if(pool.length<st.count){err.textContent='선택 범위('+pool.length+'개)가 문제 수보다 적습니다.';err.style.display='block';return;}
  err.style.display='none';
  const picked=[...pool].sort(()=>Math.random()-.5).slice(0,st.count);
  const types=Array.from(st.types);
  QS[v]=picked.map((w,i)=>({...w,type:types[i%types.length]})).sort(()=>Math.random()-.5);
  const dl=st.days==='all'?'전체범위':Array.from(st.days).sort().map(d=>'Day '+parseInt(d.replace('DAY_',''))).join(', ');
  const tl=Array.from(st.types).map(t=>t==='kor'?'우리말 뜻 쓰기':'영어 철자 쓰기').join(' + ');
  document.getElementById('ttl-'+v).textContent='토익 '+v+' 단어 테스트';
  document.getElementById('tmt-'+v).textContent='출제 범위: '+dl+' | '+QS[v].length+'문제 | '+tl;
  document.getElementById('score-'+v).style.display='none';
  document.getElementById('ql-'+v).innerHTML=QS[v].map((q,i)=>{
    const isKor=q.type==='kor';
    return '<div class="question" id="q-'+v+'-'+i+'">'
      +'<div class="q-num">'+(i+1)+'</div>'
      +'<div class="q-body">'
        +'<div class="q-word"><span class="q-badge '+(isKor?'kor':'eng')+'">'+(isKor?'뜻 쓰기':'철자 쓰기')+'</span>'+(isKor?q.eng:q.kor)+'</div>'
        +'<div class="q-input-row">'
          +'<input class="q-input" id="qi-'+v+'-'+i+'" placeholder="답을 입력하세요" onkeydown="handleEnter(event,\''+v+'\','+i+')" oninput="clearResult(\''+v+'\','+i+')">'
          +'<button class="btn-check" onclick="checkOne(\''+v+'\','+i+')">확인</button>'
          +'<span class="q-result" id="qr-'+v+'-'+i+'"></span>'
        +'</div>'
        +'<div class="q-correct-ans" id="qa-'+v+'-'+i+'"></div>'
      +'</div>'
    +'</div>';
  }).join('');
  document.getElementById('set-'+v).style.display='none';
  document.getElementById('tst-'+v).classList.add('show');
  const ql=document.getElementById('ql-'+v);
  ql.classList.remove('pcol-1','pcol-2','pcol-3');
  ql.classList.add(QS[v].length<=20?'pcol-1':QS[v].length<=32?'pcol-2':'pcol-3');
  document.getElementById('ph-'+v).innerHTML =
    '<div class="ph-top">'
      +'<div class="ph-logo">Merry <em>Toeic</em></div>'
      +'<div class="ph-mid"><div class="ph-badge">출제범위</div><div class="ph-range">'+dl+'</div></div>'
      +'<div class="ph-right"><div>이름<span class="ph-line"></span></div><div>맞힌 문제<span class="ph-line short"></span>문제 / '+QS[v].length+'문제</div></div>'
    +'</div>'
    +'<div class="ph-title-row"><div class="ph-title">메리토익 단어시험지</div><div class="ph-desc">토익 '+v+' | '+tl+'</div></div>'
    +'<hr class="ph-rule">';
  document.getElementById('ak-'+v).innerHTML =
    '<div class="ak-title">정답지 — 토익 '+v+' 단어 테스트</div>'
    +'<div class="ak-meta">'+dl+' | '+QS[v].length+'문제 | '+tl+'</div>'
    +'<div class="ak-grid">'
    +QS[v].map((q,i)=>{
      const isKor=q.type==='kor';
      return '<div class="ak-item"><span class="ak-num">'+(i+1)+'.</span><span class="ak-word">'+(isKor?q.eng:q.kor)+'</span><span class="ak-sep">—</span><span class="ak-ans">'+(isKor?q.kor:q.eng)+'</span></div>';
    }).join('')
    +'</div>';
  const fi=document.getElementById('qi-'+v+'-0');
  if(fi) fi.focus();
  window.scrollTo({top:0});
}

function checkOne(v,i){
  const q=QS[v][i];
  if(!q) return;
  const inp=document.getElementById('qi-'+v+'-'+i);
  const res=document.getElementById('qr-'+v+'-'+i);
  const ans=document.getElementById('qa-'+v+'-'+i);
  const card=document.getElementById('q-'+v+'-'+i);
  const correctAns=q.type==='kor'?q.kor:q.eng;
  const isOk=normalize(inp.value)===normalize(correctAns)||
    correctAns.split('/').map(a=>normalize(a)).includes(normalize(inp.value));
  if(isOk){
    card.className='question correct';
    res.textContent='✓ 정답';
    res.className='q-result ok';
    if(ans) ans.style.display='none';
  } else {
    card.className='question wrong';
    res.textContent='✗ 오답';
    res.className='q-result no';
    if(ans){ans.textContent='정답: '+correctAns;ans.style.display='block';}
  }
  // 다음 문제로 포커스
  var next=document.getElementById('qi-'+v+'-'+(i+1));
  if(next) setTimeout(()=>next.focus(),100);
}
function clearResult(v,i){
  const res=document.getElementById('qr-'+v+'-'+i);
  const ans=document.getElementById('qa-'+v+'-'+i);
  const card=document.getElementById('q-'+v+'-'+i);
  if(res) res.textContent='';
  if(ans) ans.style.display='none';
  if(card) card.className='question';
}
function handleEnter(e,v,i){
  if(e.key!=='Enter') return;
  var next=document.getElementById('qi-'+v+'-'+(i+1));
  if(next) next.focus();
  else grade(v);
}
function normalize(s){
  return s.trim().toLowerCase()
    .replace(/\s+/g,' ')
    .replace(/[~\[\]()（）\s]/g,'')
    .replace(/,/g,'/')
    .split('/')[0];
}

function grade(v){
  const qs=QS[v]; let correct=0;
  qs.forEach((q,i)=>{
    const inp=document.getElementById('qi-'+v+'-'+i);
    const res=document.getElementById('qr-'+v+'-'+i);
    const ans=document.getElementById('qa-'+v+'-'+i);
    const card=document.getElementById('q-'+v+'-'+i);
    const userAns=inp?inp.value:'';
    const correctAns=q.type==='kor'?q.kor:q.eng;
    const isOk = normalize(userAns)===normalize(correctAns) ||
      correctAns.split('/').map(a=>normalize(a)).includes(normalize(userAns));
    if(isOk){
      correct++;
      card.className='question correct';
      res.textContent='✓ 정답';
      res.className='q-result ok';
      ans.style.display='none';
    } else {
      card.className='question wrong';
      res.textContent='✗ 오답';
      res.className='q-result no';
      ans.textContent='정답: '+correctAns;
      ans.style.display='block';
    }
    if(inp) inp.disabled=true;
  });
  const pct=Math.round(correct/qs.length*100);
  const scoreEl=document.getElementById('score-'+v);
  scoreEl.innerHTML='<div class="score-num"><em>'+correct+'</em> / '+qs.length+'</div>'
    +'<div class="score-sub">정답률 '+pct+'% · '+(pct>=80?'🎉 훌륭해요!':pct>=60?'👍 잘했어요!':'💪 다시 도전해봐요!')+'</div>'
    +'<div class="score-bar"><div class="score-bar-fill" style="width:'+pct+'%"></div></div>';
  scoreEl.style.display='block';
  scoreEl.scrollIntoView({behavior:'smooth'});
}

function back(v){
  document.getElementById('set-'+v).style.display='block';
  document.getElementById('tst-'+v).classList.remove('show');
  document.getElementById('score-'+v).style.display='none';
}
</script>
