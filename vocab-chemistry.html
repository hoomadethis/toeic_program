document.getElementById('lvBadge').textContent = LEVEL;

/* ---------- 토큰화 / 문제 생성 ---------- */
const STOP = new Set(["a","an","the","be","is","are","am","been","being","one's","ones","sb","sth"]);
function cleanExpr(s){
  return String(s)
    .replace(/\[[^\]]*\]/g,' ')
    .replace(/\([^)]*\)/g,' ')
    .replace(/\+.*$/,' ')
    .replace(/\/.*$/,' ')
    .replace(/[~=]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function contentInfo(eng){
  const tokens = cleanExpr(eng).split(' ').filter(Boolean);
  const idxs = [];
  tokens.forEach((t,i)=>{
    const lw = t.toLowerCase();
    if(!STOP.has(lw) && /[a-z]/i.test(t)) idxs.push(i);
  });
  return {tokens, idxs};
}

// 카테고리별 오답 후보 풀 (역할별: first/last/mid + all) + 전역
const POOLS = {}; let GLOBAL_ALL = [];
(function buildPools(){
  const gseen = new Set();
  CATEGORIES.forEach(cat=>{
    POOLS[cat] = {first:[], last:[], mid:[], all:[]};
    const seen = {first:new Set(), last:new Set(), mid:new Set(), all:new Set()};
    WORDS[cat].forEach(w=>{
      const {tokens, idxs} = contentInfo(w.eng);
      idxs.forEach((pos,k)=>{
        const role = (k===0)?'first':(k===idxs.length-1?'last':'mid');
        const word = tokens[pos]; const lw = word.toLowerCase();
        if(!seen[role].has(lw)){ seen[role].add(lw); POOLS[cat][role].push(word); }
        if(!seen.all.has(lw)){ seen.all.add(lw); POOLS[cat].all.push(word); }
        if(!gseen.has(lw)){ gseen.add(lw); GLOBAL_ALL.push(word); }
      });
    });
  });
})();

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function makeQuestion(item){
  const {tokens, idxs} = contentInfo(item.eng);
  if(idxs.length===0) return null;
  const k = Math.floor(Math.random()*idxs.length);
  const tPos = idxs[k];
  const role = (k===0)?'first':(k===idxs.length-1?'last':'mid');
  const answer = tokens[tPos];
  const cat = item.cat;
  // 우선순위 유지: 같은 카테고리·같은 자리(품사) → 같은 카테고리 전체 → 전역. 티어별로만 섞음.
  const tier1 = POOLS[cat] ? shuffle(POOLS[cat][role].slice()) : [];
  const tier2 = POOLS[cat] ? shuffle(POOLS[cat].all.slice()) : [];
  const tier3 = shuffle(GLOBAL_ALL.slice());
  const cand = tier1.concat(tier2, tier3);
  const seen = new Set([answer.toLowerCase()]);
  const distractors = [];
  for(const w of cand){ const lw=w.toLowerCase(); if(!seen.has(lw)){ seen.add(lw); distractors.push(w); if(distractors.length===3) break; } }
  if(distractors.length<3) return null;
  const options = shuffle([answer, ...distractors]);
  const display = tokens.map((t,i)=> i===tPos ? '____' : t).join(' ');
  return {eng:item.eng, kor:item.kor, cat, display, answer, options};
}

/* ---------- 설정 UI ---------- */
function mkBtn(label, fn){ const b=document.createElement('button'); b.className='btn'; b.textContent=label; b.addEventListener('click',fn); return b; }
function buildRange(){
  const row=document.getElementById('rangeRow'); row.innerHTML='';
  const all=mkBtn('전체범위',()=>{ selectedDays='all'; refreshRange(); }); all.dataset.key='__all__'; row.appendChild(all);
  CATEGORIES.forEach(cat=>{ const b=mkBtn(cat,()=>toggleRange(cat)); b.dataset.key=cat; row.appendChild(b); });
  refreshRange();
}
function toggleRange(cat){
  if(selectedDays==='all') selectedDays=new Set();
  if(selectedDays.has(cat)) selectedDays.delete(cat); else selectedDays.add(cat);
  if(selectedDays.size===0) selectedDays='all';
  refreshRange();
}
function refreshRange(){
  document.querySelectorAll('#rangeRow .btn').forEach(b=>{
    const k=b.dataset.key; let on=(k==='__all__')?(selectedDays==='all'):(selectedDays!=='all'&&selectedDays.has(k));
    b.classList.toggle('selected',on);
  });
}
function buildCount(){
  const row=document.getElementById('countRow'); row.innerHTML='';
  [10,20,30,40,50].forEach(n=>{ const b=mkBtn(n+'개',()=>{ selectedCount=n; document.querySelectorAll('#countRow .btn').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); });
    if(n===selectedCount) b.classList.add('selected'); row.appendChild(b); });
}

/* ---------- 범위 → 아이템 ---------- */
function rangeItems(){
  let items=[];
  if(selectedDays==='all') CATEGORIES.forEach(c=> items=items.concat(WORDS[c].map(w=>({...w,cat:c}))));
  else selectedDays.forEach(c=> items=items.concat((WORDS[c]||[]).map(w=>({...w,cat:c}))));
  return items;
}

/* ---------- 퀴즈 진행 ---------- */
function show(id){ ['setup','quiz','result','notes'].forEach(v=>document.getElementById(v).classList.toggle('hidden', v!==id)); window.scrollTo(0,0); }

function startFromSetup(){
  const err=document.getElementById('err'); err.textContent='';
  const items=rangeItems();
  if(items.length===0){ err.textContent='선택된 범위에 단어가 없습니다.'; return; }
  if(items.length<selectedCount){ err.textContent='선택 범위의 단어 수('+items.length+'개)가 문제 수보다 적습니다. 범위를 늘리거나 문제 수를 줄여주세요.'; return; }
  startQuiz(items, selectedCount);
}
function startQuiz(items, count){
  const pool=shuffle(items.slice());
  const list=[];
  for(const it of pool){ if(list.length>=count) break; const q=makeQuestion(it); if(q) list.push(q); }
  if(list.length===0){ alert('문제를 만들 단어가 부족합니다.'); return; }
  quiz={list, idx:0, score:0, wrong:[]};
  show('quiz'); renderQuestion();
}
function renderQuestion(){
  const q=quiz.list[quiz.idx];
  document.getElementById('pgText').textContent=(quiz.idx+1)+' / '+quiz.list.length;
  document.getElementById('pgScore').textContent=quiz.score+'점';
  document.getElementById('pgBar').style.width=((quiz.idx)/quiz.list.length*100)+'%';
  document.getElementById('qKor').textContent=q.kor;
  document.getElementById('qStem').innerHTML=q.display.replace('____','<span class="blank">____</span>');
  const box=document.getElementById('qOptions'); box.innerHTML='';
  q.options.forEach(opt=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=opt;
    b.addEventListener('click',()=>pick(b,opt,q)); box.appendChild(b);
  });
  document.getElementById('qFeedback').textContent=''; document.getElementById('qFeedback').className='feedback';
  document.getElementById('nextBtn').classList.add('hidden');
}
function pick(btn, opt, q){
  const buttons=document.querySelectorAll('#qOptions .opt');
  buttons.forEach(b=>b.disabled=true);
  const correct = (opt.toLowerCase()===q.answer.toLowerCase());
  const fb=document.getElementById('qFeedback');
  if(correct){ btn.classList.add('correct'); quiz.score++; fb.textContent='정답! 👍'; fb.className='feedback ok'; }
  else{
    btn.classList.add('wrong');
    buttons.forEach(b=>{ if(b.textContent.toLowerCase()===q.answer.toLowerCase()) b.classList.add('correct'); });
    fb.textContent='오답 · 정답은 '+q.answer+' — 단어장에 저장됨'; fb.className='feedback no';
    quiz.wrong.push({eng:q.eng, kor:q.kor, cat:q.cat});
    addNote({eng:q.eng, kor:q.kor, cat:q.cat});
  }
  document.getElementById('pgScore').textContent=quiz.score+'점';
  const nb=document.getElementById('nextBtn'); nb.classList.remove('hidden');
  nb.textContent = (quiz.idx>=quiz.list.length-1)?'결과 보기':'다음';
}
document.getElementById('nextBtn').addEventListener('click',()=>{
  quiz.idx++;
  if(quiz.idx>=quiz.list.length) showResult(); else renderQuestion();
});
function showResult(){
  show('result');
  const n=quiz.list.length, s=quiz.score;
  document.getElementById('rScore').textContent=s+' / '+n;
  const pct=Math.round(s/n*100);
  let msg = pct===100?'만점! 완벽해요 🎉' : pct>=80?'좋아요, 거의 다 맞았어요' : pct>=50?'절반 이상! 틀린 건 복습하자' : '틀린 케미 단어장에서 다시 풀어봐요';
  document.getElementById('rMsg').textContent='정답률 '+pct+'% · '+msg;
  const wrap=document.getElementById('rWrongWrap'), list=document.getElementById('rWrongList');
  if(quiz.wrong.length===0){ wrap.innerHTML='<div class="empty">틀린 문제 없음 — 완벽! 🎉</div>'; }
  else{
    document.getElementById('rWrongCnt').textContent=quiz.wrong.length+'개';
    list.innerHTML='';
    quiz.wrong.forEach(w=>{ const d=document.createElement('div'); d.className='item';
      d.innerHTML='<span class="eng">'+esc(w.eng)+'</span><span class="kor">'+esc(w.kor)+'</span>'; list.appendChild(d); });
  }
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- 내 단어장 (localStorage) ---------- */
function loadNotes(){ try{ return JSON.parse(localStorage.getItem(NOTES_KEY))||[]; }catch(e){ return window.__notes||[]; } }
function saveNotes(a){ window.__notes=a; try{ localStorage.setItem(NOTES_KEY, JSON.stringify(a)); }catch(e){} updateBadge(); }
function addNote(item){ const a=loadNotes(); if(!a.some(x=>x.eng===item.eng)){ a.push(item); saveNotes(a); } }
function removeNote(eng){ saveNotes(loadNotes().filter(x=>x.eng!==eng)); renderNotes(); }
function clearNotes(){ if(confirm('단어장을 전부 비울까요?')){ saveNotes([]); renderNotes(); } }
function updateBadge(){ const a=loadNotes(); const el=document.getElementById('notesCnt'); el.textContent=a.length; el.classList.toggle('zero', a.length===0); }
function renderNotes(){
  const a=loadNotes(); const wrap=document.getElementById('notesListWrap');
  if(a.length===0){ wrap.innerHTML='<div class="empty">아직 틀린 케미가 없어요.<br>퀴즈에서 틀리면 여기 쌓입니다.</div>'; document.getElementById('quizNotesBtn').disabled=true; document.getElementById('quizNotesBtn').style.opacity=.5; return; }
  document.getElementById('quizNotesBtn').disabled=false; document.getElementById('quizNotesBtn').style.opacity=1;
  let html='<div class="notes-list">';
  a.forEach(w=>{ html+='<div class="item"><span class="eng">'+esc(w.eng)+'</span><span class="kor">'+esc(w.kor)+'</span><button class="del" data-eng="'+esc(w.eng)+'">✕</button></div>'; });
  html+='</div>'; wrap.innerHTML=html;
  wrap.querySelectorAll('.del').forEach(b=> b.addEventListener('click',()=>removeNote(b.dataset.eng)));
}
